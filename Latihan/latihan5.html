<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Latihan 5</title>
	</head>
	<body>
		<script>
			let number, inputNumber;

			do {
				inputNumber = window.prompt("Input Angka");
				if (inputNumber === null || inputNumber.trim() === "") {
					alert("Input Number gaboleh kosong atau NULL");
          continue;
				}

				number = parseInt(inputNumber);
				if (isNaN(number) || number <= 0) {
					alert("Input Number tidak valid! Masukkan angka positif.");
				}
			} while (inputNumber === null || inputNumber.trim() === "" || isNaN(number) || number <= 0);

      let i = 1;
      while(i <= number){
        document.write(i);
        i += 2;
        if(i <= number){
          document.write(", ");
        }
      };
      
		</script>
	</body>
</html>
